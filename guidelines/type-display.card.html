<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 24px; background: #fff; }
    .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-border); padding: 10px 0; }
    .row:last-child { border-bottom: none; }
    .meta { font-family: monospace; font-size: 10px; color: var(--color-steel-mid); width: 120px; flex-shrink: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="row">
    <div class="meta">72px / 700<br>−0.02em</div>
    <div style="font-family:var(--font-display);font-size:72px;font-weight:700;letter-spacing:-0.02em;color:var(--color-navy);line-height:1">Engineering</div>
  </div>
  <div class="row">
    <div class="meta">40px / 700<br>−0.01em</div>
    <div style="font-family:var(--font-display);font-size:40px;font-weight:700;letter-spacing:-0.01em;color:var(--color-navy);line-height:1">Automatic Doors · Security Systems</div>
  </div>
  <div class="row">
    <div class="meta">24px / 700<br>−0.01em</div>
    <div style="font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.01em;color:var(--color-charcoal)">Loading Dock Equipment · Road Barriers</div>
  </div>
  <div class="row">
    <div class="meta">11px / 700<br>0.25em · ALL CAPS</div>
    <div style="font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:var(--color-accent)">Engineering Excellence · 30+ Years · Saudi Arabia</div>
  </div>
</body>
</html>
