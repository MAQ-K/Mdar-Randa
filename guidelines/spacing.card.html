<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base unit · 4 → 96px" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 24px; background: #fff; }
    .row { display: flex; align-items: flex-end; gap: 6px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .block { background: var(--color-accent); opacity: 0.25; border-radius: 2px; width: 100%; }
    .label { font-family: monospace; font-size: 9px; color: var(--color-steel-mid); text-align: center; white-space: nowrap; }
    .token { font-family: monospace; font-size: 8px; color: var(--color-silver); text-align: center; white-space: nowrap; }
  </style>
</head>
<body>
<div class="row">
  <div class="item" style="flex:1"><div class="block" style="height:4px"></div><div class="label">4px</div><div class="token">--space-1</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:8px"></div><div class="label">8px</div><div class="token">--space-2</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:12px"></div><div class="label">12px</div><div class="token">--space-3</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:16px"></div><div class="label">16px</div><div class="token">--space-4</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:24px"></div><div class="label">24px</div><div class="token">--space-6</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:32px"></div><div class="label">32px</div><div class="token">--space-8</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:48px"></div><div class="label">48px</div><div class="token">--space-12</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:64px"></div><div class="label">64px</div><div class="token">--space-16</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:80px"></div><div class="label">80px</div><div class="token">--space-20</div></div>
  <div class="item" style="flex:1"><div class="block" style="height:96px"></div><div class="label">96px</div><div class="token">--space-24</div></div>
</div>
</body>
</html>
